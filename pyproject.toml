[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "classroom-flow"
version = "0.1.0"
description = "Automação terminal-first para entregas e prazos do Google Classroom"
requires-python = ">=3.9"
dependencies = [
    "google-api-python-client>=2.100",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
]

[project.scripts]
cflow = "classroom_flow.cli:main"

[tool.setuptools]
packages = ["classroom_flow"]
